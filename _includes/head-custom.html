{%- if page.content contains 'language-mermaid' -%}
<script src="{{ '/assets/vendor/mermaid.min.js' | relative_url }}" defer></script>
<style>
  .mermaid { overflow-x: auto; }
  .mermaid svg { max-width: 100%; height: auto; }
</style>
<script>
  (function () {
    function renderMermaid() {
      if (typeof mermaid === 'undefined') {
        console.error('[mermaid] 加载失败:assets/vendor/mermaid.min.js 未加载');
        return;
      }

      mermaid.initialize({ startOnLoad: false, theme: 'default' });

      // 兼容 kramdown 两种输出结构:<code class="language-mermaid"> 或外层 <div class="language-mermaid">
      document.querySelectorAll('code.language-mermaid, .language-mermaid code').forEach(function (block) {
        var pre = block.parentElement;
        var div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = block.textContent;
        pre.replaceWith(div);
      });

      mermaid.run().catch(function (err) {
        console.error('[mermaid] 渲染失败:', err);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderMermaid);
    } else {
      renderMermaid();
    }
  })();
</script>
{%- endif -%}
